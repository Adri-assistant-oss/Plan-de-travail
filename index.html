<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<style>
  :root {
    --paper: #EFE9D8;
    --card: #FCFAF2;
    --navy: #190099;
    --gold: #EEAE26;
    --ink: #201A3A;
    --ink-soft: #6B6252;
    --stamp-red: #B03A2E;
    --amber: #B4791E;
    --sage: #3E7A52;
    --line: #DCD2B4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: Georgia, 'Times New Roman', serif;
  }
  input, select, button { font-family: Georgia, 'Times New Roman', serif; }
  #app { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }

  .top-header-row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .brand-row { display:flex; align-items:center; gap:10px; }
  .brand-logo { width:40px; height:40px; object-fit:contain; flex-shrink:0; }
  .top-title { font-size:24px; font-weight:700; color:var(--navy); }
  .top-subtitle { font-size:12.5px; color:var(--ink-soft); margin-top:1px; }
  .header-actions { display:flex; gap:6px; flex-shrink:0; }
  .gold-rule { height:2px; background:var(--gold); margin:12px 0 16px; border:none; }

  .budget-tag { font-size:11.5px; font-weight:700; color:var(--navy); }
  .budget-tag.muted { color:var(--ink-soft); font-weight:400; }
  .folder-budget-total { font-size:12px; color:var(--ink-soft); margin-top:2px; }
  .budget-summary-table { width:100%; border-collapse:collapse; font-size:12.5px; }
  .budget-summary-table th, .budget-summary-table td { padding:6px 8px; border-bottom:1px solid var(--line); text-align:left; }
  .budget-summary-table th { color:var(--ink-soft); font-weight:700; font-size:11px; text-transform:uppercase; letter-spacing:0.03em; }

  .guide-btn { }

  .sync-chip { font-size:11px; padding:4px 8px; border-radius:10px; border:1px solid var(--line); color:var(--ink-soft); background:var(--card); white-space:nowrap; }
  .sync-chip.synced { border-color:var(--sage); color:var(--sage); }
  .sync-chip.error { border-color:var(--stamp-red); color:var(--stamp-red); }
  .sync-chip.syncing { border-color:var(--amber); color:var(--amber); }
  .sync-panel { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:18px; }
  .sync-panel h2 { font-size:16px; color:var(--navy); margin-bottom:4px; }
  .sync-panel .guide-intro { margin-bottom:12px; }
  .sync-panel label { display:block; font-size:11px; color:var(--ink-soft); margin-bottom:10px; }
  .sync-panel input { display:block; width:100%; margin-top:4px; padding:8px 9px; border:1px solid var(--line); border-radius:3px; font-size:13px; background:#fff; color:var(--ink); }
  .sync-actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .sync-status-line { font-size:12px; margin-top:10px; padding:8px 10px; border-radius:4px; }
  .sync-status-line.ok { background:rgba(62,122,82,0.1); color:var(--sage); }
  .sync-status-line.bad { background:rgba(176,58,46,0.1); color:var(--stamp-red); }
  .sync-status-line.neutral { background:var(--paper); color:var(--ink-soft); }
  .guide-panel { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:16px; margin-bottom:18px; }
  .guide-panel h2 { font-size:16px; color:var(--navy); margin-bottom:4px; }
  .guide-intro { font-size:12.5px; color:var(--ink-soft); margin-bottom:14px; }
  .guide-step { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--line); }
  .guide-step:first-of-type { border-top:none; }
  .guide-num { flex-shrink:0; width:22px; height:22px; border-radius:50%; background:var(--navy); color:#fff; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .guide-step-title { font-size:13.5px; font-weight:700; margin-bottom:2px; }
  .guide-step-desc { font-size:12.5px; color:var(--ink-soft); line-height:1.45; }
  .guide-close { display:block; margin:12px auto 0; background:none; border:none; color:var(--navy); font-size:12.5px; text-decoration:underline; cursor:pointer; }

  .export-menu { position:relative; }
  .export-btn, .stats-btn {
    background:var(--card); border:1px solid var(--line); color:var(--navy);
    font-size:12px; font-weight:700; padding:8px 10px; border-radius:4px; cursor:pointer;
  }
  .stats-btn.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  .export-dropdown {
    position:absolute; right:0; top:calc(100% + 4px); background:var(--card);
    border:1px solid var(--line); border-radius:4px; overflow:hidden; z-index:10;
    box-shadow:0 4px 10px rgba(0,0,0,0.12); min-width:170px; display:none;
  }
  .export-dropdown.open { display:block; }
  .export-dropdown button {
    display:block; width:100%; text-align:left; background:none; border:none;
    padding:9px 12px; font-size:12.5px; color:var(--ink); cursor:pointer;
  }
  .export-dropdown button:not(:last-child) { border-bottom:1px solid var(--line); }
  .export-dropdown button:hover { background:var(--paper); }

  .summary-strip { display:flex; gap:8px; margin:4px 0 14px; flex-wrap:wrap; }
  .chip { font-size:12px; padding:6px 10px; border-radius:3px; border:1px solid var(--line); background:var(--card); }
  .chip.alert { border-color:var(--stamp-red); color:var(--stamp-red); }
  .chip.warn { border-color:var(--amber); color:var(--amber); }
  .chip.ok { color:var(--sage); border-color:var(--sage); }

  .filter-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .filter-select { font-size:12.5px; padding:6px 8px; border:1px solid var(--line); border-radius:4px; background:var(--card); color:var(--ink); }

  .stats-view { margin-bottom:20px; }
  .chart-wrap { background:var(--card); border:1px solid var(--line); border-radius:4px; padding:14px 12px; margin-bottom:14px; }
  .chart-title { font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:10px; }
  .bar-group { display:flex; align-items:flex-end; gap:14px; height:140px; margin-bottom:6px; }
  .bar-col { display:flex; flex-direction:column; align-items:center; justify-content:flex-end; flex:1; height:100%; }
  .bar-stack { width:100%; max-width:34px; display:flex; flex-direction:column-reverse; }
  .bar-seg { width:100%; }
  .bar-label { font-size:10.5px; color:var(--ink-soft); margin-top:6px; }
  .bar-legend { display:flex; gap:10px; flex-wrap:wrap; font-size:11px; color:var(--ink-soft); }
  .legend-dot { display:inline-block; width:9px; height:9px; border-radius:2px; margin-right:4px; vertical-align:middle; }

  .dossier-list { display:flex; flex-direction:column; gap:10px; }
  .dossier-card {
    text-align:left; background:var(--card); border:1px solid var(--line); border-left-width:4px;
    border-radius:4px; padding:12px 14px; cursor:pointer; width:100%; display:block;
  }
  .dossier-card-top { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:8px; }
  .dossier-tags { display:flex; align-items:center; gap:6px; margin-bottom:3px; }
  .dossier-year { font-size:11.5px; color:var(--ink-soft); font-weight:600; }
  .type-badge { font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:3px; border:1px solid; letter-spacing:0.02em; }
  .dossier-category { font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .dossier-name { font-size:15.5px; font-weight:700; line-height:1.25; }
  .dossier-pct { font-size:15px; font-weight:700; flex-shrink:0; }
  .progress-track { height:6px; background:var(--line); border-radius:3px; overflow:hidden; }
  .progress-track.small { height:5px; }
  .progress-fill { height:100%; border-radius:3px; }
  .dossier-card-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:9px; }
  .deadline-tag { font-size:12px; font-weight:500; }
  .deadline-tag.muted { color:var(--ink-soft); font-weight:400; }
  .dossier-count { font-size:11px; color:var(--ink-soft); }

  .new-dossier-cta {
    margin-top:14px; width:100%; padding:12px; border:1.5px dashed var(--navy); border-radius:4px;
    background:transparent; color:var(--navy); font-size:14px; font-weight:700; cursor:pointer;
  }
  .new-form { margin-top:12px; background:var(--card); border:1px solid var(--line); border-radius:4px; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .new-form input, .new-form select { padding:9px 10px; border:1px solid var(--line); border-radius:3px; font-size:14px; background:#fff; width:100%; }
  .new-form-grid { display:flex; gap:8px; }
  .new-form-grid > * { flex:1; min-width:0; }
  .field-label { font-size:11px; color:var(--ink-soft); display:block; margin-bottom:3px; }
  .new-form-actions { display:flex; gap:8px; }
  .btn-primary { background:var(--navy); color:#fff; border:none; padding:9px 14px; border-radius:3px; font-size:13.5px; font-weight:700; cursor:pointer; }
  .btn-secondary { background:transparent; border:1px solid var(--line); color:var(--ink-soft); padding:9px 14px; border-radius:3px; font-size:13.5px; cursor:pointer; }

  .detail-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
  .back-btn { background:none; border:none; color:var(--navy); font-size:14px; font-weight:700; cursor:pointer; padding:4px 0; }
  .delete-dossier-btn { background:none; border:none; color:var(--stamp-red); font-size:12px; cursor:pointer; }
  .folder-tab { background:var(--card); border:1px solid var(--line); border-left-width:5px; border-radius:4px; padding:14px 16px; margin-bottom:20px; }
  .folder-top-row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .folder-year { font-size:12px; color:var(--ink-soft); font-weight:700; }
  .folder-category { font-size:11px; color:var(--ink-soft); }
  .folder-title { font-size:19px; font-weight:700; margin:6px 0 12px; line-height:1.3; }
  .folder-fields { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; }
  .folder-field { font-size:10.5px; color:var(--ink-soft); flex:1; min-width:90px; }
  .folder-field select, .folder-field input { display:block; width:100%; margin-top:3px; padding:6px 7px; border:1px solid var(--line); border-radius:3px; font-size:12.5px; background:#fff; color:var(--ink); }
  .deposit-toggle { display:block; width:100%; margin-bottom:12px; padding:9px; border-radius:4px; border:1.5px solid var(--sage); background:transparent; color:var(--sage); font-size:13px; font-weight:700; cursor:pointer; }
  .deposit-toggle.on { background:var(--sage); color:#fff; }
  .progress-row { display:flex; align-items:center; gap:10px; }
  .progress-row .progress-track { flex:1; }
  .progress-pct { font-size:13px; font-weight:700; }

  .section-block { margin-bottom:22px; }
  .section-title { font-size:15px; font-weight:700; color:var(--navy); margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid var(--gold); }
  .empty-hint { font-size:13px; color:var(--ink-soft); margin:0 0 8px; }

  .item-row { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  .item-main { flex:1; min-width:0; }
  .item-name { font-size:14px; line-height:1.3; }
  .item-name.done { color:var(--ink-soft); text-decoration:line-through; }
  .item-meta { display:flex; align-items:center; gap:6px; margin-top:3px; }
  .deadline-input { font-size:11px; border:none; background:transparent; color:var(--ink-soft); padding:0; width:92px; }
  .step-check { flex-shrink:0; width:24px; height:24px; border-radius:50%; border:1.5px solid var(--ink-soft); background:#fff; font-size:11px; font-weight:700; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center; }
  .step-check.checked { background:var(--sage); border-color:var(--sage); color:#fff; }
  .pill { flex-shrink:0; font-size:11px; font-weight:700; padding:4px 8px; border-radius:3px; border:1px solid; background:none; cursor:pointer; white-space:nowrap; }
  .delete-btn { flex-shrink:0; background:none; border:none; color:var(--ink-soft); font-size:18px; line-height:1; cursor:pointer; padding:0 2px; }
  .add-row { display:flex; gap:6px; margin-top:10px; }
  .add-input { flex:1; padding:8px 10px; border:1px solid var(--line); border-radius:3px; font-size:13.5px; background:#fff; }
  .add-btn { padding:8px 12px; border:1px solid var(--navy); background:var(--navy); color:#fff; border-radius:3px; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .error-banner { background:rgba(176,58,46,0.1); border:1px solid var(--stamp-red); color:var(--stamp-red); font-size:12.5px; padding:8px 10px; border-radius:4px; margin-bottom:14px; }
  .info-banner { background:rgba(25,0,153,0.06); border:1px solid var(--navy); color:var(--navy); font-size:12px; padding:8px 10px; border-radius:4px; margin-bottom:14px; }
  .reset-link { display:block; margin:24px auto 0; background:none; border:none; color:var(--ink-soft); font-size:12px; text-decoration:underline; cursor:pointer; }

  .print-only { display:none; }
  @media print {
    body > *:not(.print-only) { display:none !important; }
    .print-only { display:block !important; color:#000; font-family:Georgia,serif; }
  }
  .print-header { display:flex; align-items:center; gap:10px; margin-bottom:16px; }
  .print-logo { width:44px; height:44px; object-fit:contain; }
  .print-title { font-size:19px; }
  .print-dossier { margin-bottom:22px; page-break-inside:avoid; }
  .print-dossier-title { font-size:14.5px; margin:0 0 4px; }
  .print-progress { font-size:12px; color:#444; margin-bottom:8px; }
  .print-section-title { font-size:12.5px; margin:10px 0 4px; text-transform:uppercase; letter-spacing:0.03em; }
  .print-table { width:100%; border-collapse:collapse; font-size:12px; margin-bottom:6px; }
  .print-table th, .print-table td { border:1px solid #ccc; padding:4px 6px; text-align:left; }
  .print-table th { background:#f0ece0; }
</style>
</head>

function daysUntil(dateStr) {
  if (!dateStr) return null;
  const today = new Date(todayISO());
  const target = new Date(dateStr);
  return Math.round((target - today) / (1000 * 60 * 60 * 24));
}
function formatDate(dateStr) {
  if (!dateStr) return "";
  const d = new Date(dateStr);
  return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" });
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}

function docStatusLabel(status) { return STATUS_META[status] ? STATUS_META[status].label : status; }

const CURRENCIES = ["XOF", "EUR", "USD"];
function formatBudget(amount, currency) {
  const n = Number(amount);
  if (!amount || isNaN(n)) return "";
  const formatted = n.toLocaleString("fr-FR");
  return formatted + " " + (currency || "XOF");
}

function computeStats(dossier) {
  const docItems = dossier.documents.map((d) => ({ ...d, isDone: d.status === "fourni" }));
  const stepItems = dossier.steps.map((s) => ({ ...s, isDone: s.done }));
  const all = [...docItems, ...stepItems];
  const total = all.length;
  const done = all.filter((i) => i.isDone).length;
  const pct = total === 0 ? 0 : Math.round((done / total) * 100);
  let nextDeadline = null, overdue = 0, soon = 0;
  all.forEach((item) => {
    if (item.isDone || !item.deadline) return;
    const d = daysUntil(item.deadline);
    if (d < 0) overdue += 1; else if (d <= 7) soon += 1;
    if (!nextDeadline || item.deadline < nextDeadline) nextDeadline = item.deadline;
  });
  if (!dossier.deposited && dossier.depositDeadline) {
    const d = daysUntil(dossier.depositDeadline);
    if (d < 0) overdue += 1; else if (d <= 7) soon += 1;
    if (!nextDeadline || dossier.depositDeadline < nextDeadline) nextDeadline = dossier.depositDeadline;
  }
  let state = "neutral";
  if (dossier.deposited) state = "complete";
  else if (overdue > 0) state = "overdue";
  else if (pct === 100 && total > 0) state = "complete";
  else if (soon > 0) state = "soon";
  return { total, done, pct, nextDeadline, overdue, soon, state };
}
function stateColor(state) {
  switch (state) {
    case "overdue": return "var(--stamp-red)";
    case "soon": return "var(--amber)";
    case "complete": return "var(--sage)";
    default: return "var(--navy)";
  }
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function exportAsJSON() {
  const blob = new Blob([JSON.stringify(state.dossiers, null, 2)], { type: "application/json" });
  downloadBlob(blob, "classeur-" + todayISO() + ".json");
}
function flattenForExport(dossiers) {
  const rows = [];
  const sorted = [...dossiers].sort((a, b) => (a.year || "").localeCompare(b.year || ""));
  sorted.forEach((d) => {
    const base = {
      "Année": d.year || "", "Type": d.dossierType || "", "Dossier": d.name, "Catégorie": d.category || "",
      "Budget": d.budget || "", "Devise": d.budgetCurrency || "",
      "Statut dépôt": d.deposited ? "Déposé" : "En cours", "Date limite dépôt": d.depositDeadline || "",
    };
    d.documents.forEach((doc) => rows.push({ ...base, "Élément": doc.name, "Type élément": "Document", "Statut élément": docStatusLabel(doc.status), "Échéance élément": doc.deadline || "" }));
    d.steps.forEach((s) => rows.push({ ...base, "Élément": s.label, "Type élément": "Démarche", "Statut élément": s.done ? "Fait" : "À faire", "Échéance élément": s.deadline || "" }));
    if (d.documents.length === 0 && d.steps.length === 0) rows.push({ ...base, "Élément": "(dossier vide)", "Type élément": "", "Statut élément": "", "Échéance élément": "" });
  });
  return rows;
}
function buildYearSummary(dossiers) {
  const map = {};
  dossiers.forEach((d) => {
    const y = d.year || "Sans année";
    if (!map[y]) {
      map[y] = { "Année": y, AO: 0, AMI: 0, Autre: 0, "Déposés": 0, "Total dossiers": 0 };
      CURRENCIES.forEach((c) => { map[y]["Budget " + c] = 0; });
    }
    const t = d.dossierType || "Autre";
    map[y][t] = (map[y][t] || 0) + 1;
    if (d.deposited) map[y]["Déposés"] += 1;
    map[y]["Total dossiers"] += 1;
    const amt = Number(d.budget);
    if (d.budget && !isNaN(amt)) {
      const cur = d.budgetCurrency || "XOF";
      map[y]["Budget " + cur] = (map[y]["Budget " + cur] || 0) + amt;
    }
  });
  return Object.values(map).sort((a, b) => String(a["Année"]).localeCompare(String(b["Année"])));
}
function exportAsExcel() {
  if (typeof XLSX === "undefined") {
    alert("La bibliothèque Excel n'a pas pu se charger (connexion internet requise pour cet export). Essayez le JSON en attendant.");
    return;
  }
  const rows = flattenForExport(state.dossiers);
  const summary = buildYearSummary(state.dossiers);
  const detailSheet = XLSX.utils.json_to_sheet(rows);
  detailSheet["!cols"] = [{wch:8},{wch:8},{wch:30},{wch:16},{wch:14},{wch:8},{wch:12},{wch:14},{wch:30},{wch:12},{wch:12},{wch:14}];
  const summarySheet = XLSX.utils.json_to_sheet(summary);
  summarySheet["!cols"] = [{wch:12},{wch:8},{wch:8},{wch:8},{wch:10},{wch:14},{wch:14},{wch:14},{wch:14}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, summarySheet, "Résumé par année");
  XLSX.utils.book_append_sheet(wb, detailSheet, "Détail");
  const out = XLSX.write(wb, { bookType: "xlsx", type: "array" });
  downloadBlob(new Blob([out], { type: "application/octet-stream" }), "classeur-AMD-" + todayISO() + ".xlsx");
}

function loadSyncConfig() {
  try {
    const raw = localStorage.getItem(SYNC_CONFIG_KEY);
    if (raw) state.sync = JSON.parse(raw);
  } catch (e) { /* ignore, keep defaults */ }
}
function saveSyncConfig() {
  try { localStorage.setItem(SYNC_CONFIG_KEY, JSON.stringify(state.sync)); } catch (e) { /* ignore */ }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state.dossiers = JSON.parse(raw);
    else { state.dossiers = seedDossiers(); persistLocalOnly(); }
  } catch (e) { state.dossiers = seedDossiers(); }
}
function persistLocalOnly() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.dossiers));
    state.error = null;
  } catch (e) {
    state.error = "La sauvegarde locale a échoué (mode navigation privée ou stockage plein).";
  }
}

let pushTimer = null;
function persist() {
  persistLocalOnly();
  if (state.sync.enabled && state.sync.url && state.sync.token) {
    state.syncStatus = "syncing";
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => pushRemote(), 500);
  }
}

async function fetchRemote() {
  if (!state.sync.enabled || !state.sync.url || !state.sync.token) return null;
  try {
    const url = state.sync.url + (state.sync.url.includes("?") ? "&" : "?") + "token=" + encodeURIComponent(state.sync.token);
    const res = await fetch(url, { method: "GET" });
    const data = await res.json();
    if (data && data.error) { state.syncStatus = "error"; state.syncMessage = "Jeton refusé par le script."; return null; }
    state.syncStatus = "synced";
    state.syncMessage = "";
    return Array.isArray(data) ? data : [];
  } catch (e) {
    state.syncStatus = "offline";
    state.syncMessage = "Connexion au script impossible — mode hors-ligne actif.";
    return null;
  }
}

async function pushRemote() {
  if (!state.sync.enabled || !state.sync.url || !state.sync.token) return;
  try {
    const res = await fetch(state.sync.url, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ token: state.sync.token, dossiers: state.dossiers }),
    });
    const data = await res.json();
    if (data && data.error) { state.syncStatus = "error"; state.syncMessage = "Jeton refusé par le script."; }
    else { state.syncStatus = "synced"; state.syncMessage = ""; }
  } catch (e) {
    state.syncStatus = "offline";
    state.syncMessage = "Sauvegarde locale gardée, la synchronisation se fera à la reconnexion.";
  }
  render();
}

  if (!deadline) return "";
  const d = daysUntil(deadline);
  let tone = "var(--ink-soft)", text = formatDate(deadline);
  if (!done) {
    if (d < 0) { tone = "var(--stamp-red)"; text = "en retard · " + formatDate(deadline); }
    else if (d === 0) { tone = "var(--amber)"; text = "aujourd'hui"; }
    else if (d <= 7) { tone = "var(--amber)"; text = "dans " + d + " j · " + formatDate(deadline); }
  }
  return '<span class="deadline-tag" style="color:' + tone + '">' + esc(text) + "</span>";
}

function getFiltered() {
  return state.dossiers.filter((d) => {
    if (state.filterYear !== "Toutes" && d.year !== state.filterYear) return false;
    if (state.filterType !== "Tous" && (d.dossierType || "Autre") !== state.filterType) return false;
    return true;
  });
}
function getSorted(list) {
  return [...list].sort((a, b) => {
    const sa = computeStats(a), sb = computeStats(b);
    const rank = { overdue: 0, soon: 1, neutral: 2, complete: 3 };
    if (rank[sa.state] !== rank[sb.state]) return rank[sa.state] - rank[sb.state];
    if (sa.nextDeadline && sb.nextDeadline) return sa.nextDeadline.localeCompare(sb.nextDeadline);
    if (sa.nextDeadline) return -1;
    if (sb.nextDeadline) return 1;
    return 0;
  });
}

  const errorHTML = state.error ? '<div class="error-banner">' + esc(state.error) + "</div>" : "";
  const infoHTML = state.sync.enabled
    ? '<div class="info-banner">Synchronisé via Google Sheets — repli automatique sur ce navigateur si la connexion coupe.</div>'
    : '<div class="info-banner">Application indépendante — vos données restent sur cet appareil, dans ce navigateur.</div>';
  const guideHTML = (state.showGuide && state.view !== "detail") ? guidePanelHTML() : "";
  const syncPanelHTML = (state.showSync && state.view !== "detail") ? syncPanelHTML_() : "";

  let body;
  if (state.view === "detail") {
    const d = findDossier(state.selectedId);
    body = d ? dossierDetailHTML(d) : dashboardHTML();
  } else {
    body = dashboardHTML();
  }

  app.innerHTML = header + printableHTML() + errorHTML + infoHTML + syncPanelHTML + guideHTML + body;
  bindInputPersistence();
}

function bindInputPersistence() {
  const nameInput = document.getElementById("nf-name");
  if (nameInput) nameInput.focus();
}

function onAppClick(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.dataset.action;
  const dossierId = el.dataset.dossier;

  if (action === "open-dossier") { state.selectedId = dossierId; state.view = "detail"; render(); return; }
  if (action === "back") { state.view = "dashboard"; state.selectedId = null; render(); return; }
  if (action === "delete-dossier") {
    if (!confirm("Supprimer définitivement ce dossier ?")) return;
    state.dossiers = state.dossiers.filter((d) => d.id !== dossierId);
    persist(); state.view = "dashboard"; state.selectedId = null; render(); return;
  }
  if (action === "toggle-deposited") {
    const d = findDossier(dossierId); d.deposited = !d.deposited; persist(); render(); return;
  }
  if (action === "cycle-doc") {
    const d = findDossier(dossierId); const doc = d.documents.find((x) => x.id === el.dataset.item);
    const order = ["manquant","en_cours","fourni"];
    doc.status = order[(order.indexOf(doc.status) + 1) % order.length];
    persist(); render(); return;
  }
  if (action === "toggle-step") {
    const d = findDossier(dossierId); const s = d.steps.find((x) => x.id === el.dataset.item);
    s.done = !s.done; persist(); render(); return;
  }
  if (action === "delete-item") {
    const d = findDossier(dossierId);
    if (el.dataset.kind === "doc") d.documents = d.documents.filter((x) => x.id !== el.dataset.item);
    else d.steps = d.steps.filter((x) => x.id !== el.dataset.item);
    persist(); render(); return;
  }
  if (action === "add-doc") {
    const input = document.querySelector('[data-role="add-doc-input"][data-dossier="' + dossierId + '"]');
    const v = input.value.trim(); if (!v) return;
    const d = findDossier(dossierId);
    d.documents.push({ id: uid(), name: v, status: "manquant", deadline: "" });
    persist(); render(); return;
  }
  if (action === "add-step") {
    const input = document.querySelector('[data-role="add-step-input"][data-dossier="' + dossierId + '"]');
    const v = input.value.trim(); if (!v) return;
    const d = findDossier(dossierId);
    d.steps.push({ id: uid(), label: v, done: false, deadline: "" });
    persist(); render(); return;
  }
  if (action === "show-new-form") { state.showNewForm = true; render(); return; }
  if (action === "cancel-new-form") { state.showNewForm = false; render(); return; }
  if (action === "create-dossier") {
    const name = document.getElementById("nf-name").value.trim();
    if (!name) return;
    const dossier = {
      id: uid(), name,
      category: document.getElementById("nf-category").value.trim(),
      dossierType: document.getElementById("nf-type").value,
      year: document.getElementById("nf-year").value.trim() || currentYear(),
      depositDeadline: document.getElementById("nf-deadline").value,
      budget: document.getElementById("nf-budget").value,
      budgetCurrency: document.getElementById("nf-currency").value,
      deposited: false, documents: [], steps: [],
    };
    state.dossiers.push(dossier); state.showNewForm = false; persist(); render(); return;
  }
  if (action === "reset-all") {
    if (!confirm("Réinitialiser tout le classeur ? Cette action est irréversible.")) return;
    state.dossiers = seedDossiers(); persist(); state.view = "dashboard"; render(); return;
  }
  if (action === "toggle-stats") { state.showStats = !state.showStats; render(); return; }
  if (action === "toggle-guide") { state.showGuide = !state.showGuide; render(); return; }
  if (action === "toggle-sync-panel") { state.showSync = !state.showSync; render(); return; }
  if (action === "save-sync") {
    const url = document.getElementById("sync-url-input").value.trim();
    const token = document.getElementById("sync-token-input").value.trim();
    if (!url || !token) { state.syncMessage = "URL et jeton sont tous les deux requis."; state.syncStatus = "error"; render(); return; }
    state.sync = { url, token, enabled: true };
    saveSyncConfig();
    state.syncStatus = "syncing";
    state.syncMessage = "";
    render();
    fetchRemote().then((remote) => {
      if (remote && remote.length > 0) {
        if (confirm("Des dossiers existent déjà sur la feuille Google. Les charger ici (remplace la liste actuelle) ? Annuler = garder les dossiers de cet appareil et les envoyer vers la feuille.")) {
          state.dossiers = remote;
          persistLocalOnly();
        } else {
          pushRemote();
        }
      } else {
        pushRemote();
      }
      render();
    });
    return;
  }
  if (action === "disable-sync") {
    state.sync = { url: state.sync.url, token: state.sync.token, enabled: false };
    saveSyncConfig();
    state.syncStatus = "idle";
    state.syncMessage = "";
    render();
    return;
  }
  if (action === "toggle-export") { state.exportOpen = !state.exportOpen; render(); return; }
  if (action === "export-json") { exportAsJSON(); state.exportOpen = false; render(); return; }
  if (action === "export-excel") { exportAsExcel(); state.exportOpen = false; render(); return; }
  if (action === "export-pdf") { state.exportOpen = false; render(); setTimeout(() => window.print(), 80); return; }
}

function onAppChange(e) {
  const el = e.target;
  const action = el.dataset.action;
  if (!action) return;
  const dossierId = el.dataset.dossier;
  if (action === "set-filter-year") { state.filterYear = el.value; render(); return; }
  if (action === "set-filter-type") { state.filterType = el.value; render(); return; }
  if (action === "set-type") { findDossier(dossierId).dossierType = el.value; persist(); render(); return; }
  if (action === "set-year") { findDossier(dossierId).year = el.value; persist(); render(); return; }
  if (action === "set-deposit-deadline") { findDossier(dossierId).depositDeadline = el.value; persist(); render(); return; }
  if (action === "set-budget") { findDossier(dossierId).budget = el.value; persist(); render(); return; }
  if (action === "set-budget-currency") { findDossier(dossierId).budgetCurrency = el.value; persist(); render(); return; }
  if (action === "item-deadline") {
    const d = findDossier(dossierId);
    const list = el.dataset.kind === "doc" ? d.documents : d.steps;
    const item = list.find((x) => x.id === el.dataset.item);
    item.deadline = el.value; persist(); render(); return;
  }
}

document.addEventListener("click", (e) => {
  if (!e.target.closest(".export-menu") && state.exportOpen) { state.exportOpen = false; render(); }
});

document.getElementById("app").addEventListener("click", onAppClick);
document.getElementById("app").addEventListener("change", onAppChange);
document.getElementById("app").addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  const role = e.target.dataset.role;
  if (role === "add-doc-input") {
    e.preventDefault();
    const btn = document.querySelector('[data-action="add-doc"][data-dossier="' + e.target.dataset.dossier + '"]');
    if (btn) onAppClick({ target: btn });
  } else if (role === "add-step-input") {
    e.preventDefault();
    const btn = document.querySelector('[data-action="add-step"][data-dossier="' + e.target.dataset.dossier + '"]');
    if (btn) onAppClick({ target: btn });
  }
});

loadSyncConfig();
load();
render();
if (state.sync.enabled) {
  fetchRemote().then((remote) => {
    if (remote) {
      state.dossiers = remote;
      persistLocalOnly();
    }
    render();
  });
}
</script>
</body>
</html>
